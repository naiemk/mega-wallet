name: mega-wallet
version: 1
rawBase: /workspaces/mega-wallet/dist
packagerRaw: "/workspaces/mega-wallet/node_modules/.pnpm/vibed-infra@0.5.0/node_modules/vibed-infra"
network:
  edge: mega-wallet-edge
images:
  backend: "ghcr.io/naiemk/mega-wallet-api:main"
  ui: "ghcr.io/naiemk/mega-wallet-ui:main"
  worker: "ghcr.io/naiemk/mega-wallet-worker:main"
  nginx: "nginx:alpine"
autoUpdate:
  lockFile: /var/lock/infra-auto-update.lock
profiles:
  api:
    role: backend
    templates:
      config: api-app.yaml
      envExample: .env.api.example
    startScript: start-api.sh
    updateScript: update-api.sh
    autoUpdate:
      flag: API_AUTO_UPDATE
      intervalEnv: API_AUTO_UPDATE_INTERVAL_MIN
      offset: 0
      stopTimeoutEnv: API_STOP_TIMEOUT
  ui:
    role: ui
    templates:
      envExample: .env.ui.example
    startScript: start-ui.sh
    updateScript: update-ui.sh
    autoUpdate:
      flag: UI_AUTO_UPDATE
      intervalEnv: UI_AUTO_UPDATE_INTERVAL_MIN
      offset: 15
      stopTimeoutEnv: UI_STOP_TIMEOUT
  nodes:
    role: workers
    templates:
      config: nodes-workers.yaml
      envExample: .env.nodes.example
      compose: docker-compose.workers.yml
    startScript: start-nodes.sh
    updateScript: update-nodes.sh
    autoUpdate:
      flag: NODES_AUTO_UPDATE
      intervalEnv: NODES_AUTO_UPDATE_INTERVAL_MIN
      offset: 10
      stopTimeoutEnv: NODES_STOP_TIMEOUT
    workers:
      services:
        - name: worker
          containerName: mega-wallet-worker
          roleEnv: WORKER_ROLE=heartbeat
  gateway:
    role: gateway
    mode: standalone
    templates:
      envExample: .env.gateway.example
    startScript: start-gateway.sh
    updateScript: update-gateway.sh
    autoUpdate:
      flags:
        - GATEWAY_AUTO_UPDATE
      intervalEnv: GATEWAY_AUTO_UPDATE_INTERVAL_MIN
      offset: 20
      stopTimeoutEnv: GATEWAY_STOP_TIMEOUT
    sites:
      - host: wallet.example.com
        backend: mega-wallet-api
        backendPort: 8080
        ui: mega-wallet-ui
        uiPort: 80
        healthPath: /api/health
        tlsCertDir: /etc/letsencrypt/live/wallet.example.com
        aliases:
        - www.wallet.example.com
