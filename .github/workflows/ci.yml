name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @mega-wallet/core build
      - run: pnpm test
      - run: pnpm --filter @mega-wallet/ui build
      - run: npm install vibed-infra
      - run: chmod +x package.sh && ./package.sh
      - run: git diff --exit-code dist || (echo "dist/ drift — run ./package.sh and commit" && exit 1)
