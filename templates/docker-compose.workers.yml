# Mega Wallet worker compose — generated into dist by package.sh
networks:
  edge:
    external: true
    name: ${DOCKER_NETWORK:-mega-wallet-edge}

services:
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/naiemk/mega-wallet-worker:main}
    container_name: ${WORKER_CONTAINER_NAME:-mega-wallet-worker}
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-64m}
    env_file: .env
    environment:
      API_URL: ${API_URL:-http://mega-wallet-api:8080}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-worker-token}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-15000}
    networks:
      - edge
