# Add inside the pool.trustless-commerce.com server block, BEFORE `location /api/`.
# Allows the wallet UI to iframe TC checkout via /api/tc-embed (same pattern as TC onramp-demo).

  location ^~ /api/tc-embed {
    limit_req zone=api_public burst=40 nodelay;
    proxy_pass http://$mw_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
  }
